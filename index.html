IMG.darba='darba.jpg.jpeg';const B=[
{id:'sudfati',t:'صُدفتي',s:'نصوص بقلم محمد طراد علاونه.',d:'مجموعة نصوص أدبية وخواطر بقلم محمد طراد علاونه، إصدار 2025.',p:5,pg:144},
{id:'darba',t:'الضربة القاضية',s:'رواية عن شوق وحنين وأشياء لا تُقال.',d:'رواية عن شوق وحنين وأشياء لا تُقال، وعن تفاصيل صغيرة لا تُنسى.',p:4,pg:100},
{id:'hada',t:'ما حدا سألني',s:'كتاب عن الأشياء التي لم يلتفت لها أحد.',d:'نصوص وخواطر تتحدث عن الكتمان، وعن تفاصيل تمرّ بصمت دون أن ينتبه إليها أحد.',p:5}];
const $=s=>document.querySelector(s),f=n=>n.toFixed(3)+' د.أ';
let C={};try{C=JSON.parse(localStorage.getItem('c')||'{}')}catch(e){}
const sv=()=>{try{localStorage.setItem('c',JSON.stringify(C))}catch(e){}};
const cnt=()=>Object.values(C).reduce((a,b)=>a+b,0),sub=()=>B.reduce((a,b)=>a+(C[b.id]||0)*b.p,0);
const cover=b=>IMG[b.id]?`<img class="ci" src="${IMG[b.id]}" alt="${b.t}">`:`<div class="cv"><span>${b.t}</span></div>`;
function grid(){$('#g').innerHTML=B.map(b=>`<div class="cd" onclick="show('${b.id}')">${cover(b)}<div class="bd"><h3>${b.t}</h3><p>${b.s}</p><span class="pr">ورقي ${f(b.p)}</span><button class="bt">التفاصيل</button></div></div>`).join('');$('#n').textContent=cnt()}
function open(h){$('#sh').innerHTML=`<button class="x" onclick="close_()">×</button>`+h;$('#ov').classList.add('on')}
function close_(){$('#ov').classList.remove('on')}
function show(id){const b=B.find(x=>x.id==id);open(`${cover(b)}<h2>${b.t}</h2><p class="m">${b.s}</p><p>${b.d}</p>${b.pg?`<p class="m">${b.pg} صفحة</p>`:''}<span class="pr">ورقي ${f(b.p)}</span><button class="bt w" onclick="add('${b.id}')">أضف للسلة</button>`)}
function add(id){C[id]=(C[id]||0)+1;sv();grid();cart()}
function chg(id,d){C[id]=(C[id]||0)+d;if(C[id]<=0)delete C[id];sv();grid();cart()}
function cart(){const it=B.filter(b=>C[b.id]);open(`<h2>سلتي</h2>`+(it.length?it.map(b=>`<div class="ln"><b>${b.t}</b><span class="q"><button onclick="chg('${b.id}',-1)">−</button>${C[b.id]}<button onclick="chg('${b.id}',1)">+</button></span><span>${f(b.p*C[b.id])}</span></div>`).join('')+`<div class="ln"><span>المجموع</span><span>${f(sub())}</span></div><div class="ln"><span>التوصيل</span><span>${f(DEL)}</span></div><div class="ln t"><span>الإجمالي</span><span>${f(sub()+DEL)}</span></div><button class="bt w" onclick="co()">إتمام الطلب</button>`:'<p class="m">السلة فاضية.</p>'))}
function co(){open(`<h2>بيانات التوصيل</h2><input id="a1" placeholder="الاسم الكامل"><input id="a2" placeholder="رقم الهاتف" inputmode="tel"><input id="a3" placeholder="المدينة"><input id="a4" placeholder="العنوان بالتفصيل"><label class="rd"><input type="radio" name="pm" value="الدفع عند الاستلام" checked> الدفع عند الاستلام</label><label class="rd"><input type="radio" name="pm" value="CliQ"> تحويل CliQ إلى ${CLIQ}</label><p id="er" class="er"></p><button class="bt w" onclick="ok()">تأكيد الطلب · ${f(sub()+DEL)}</button>`)}
function ok(){const v=i=>$('#a'+i).value.trim(),pm=document.querySelector('input[name=pm]:checked').value;
if(!v(1)||v(2).replace(/\D/g,'').length<9||!v(3)||!v(4)){$('#er').textContent='عبّي كل الخانات، ورقم الهاتف لازم يكون صحيح.';return}
const id='M'+Date.now().toString().slice(-6),L=B.filter(b=>C[b.id]).map(b=>`${b.t} × ${C[b.id]}`).join('\n');
const msg=`طلب جديد ${id}\n${L}\nالإجمالي: ${f(sub()+DEL)}\nالدفع: ${pm}\n${v(1)} | ${v(2)}\n${v(3)} - ${v(4)}`;
C={};sv();grid();
open(`<h2>وصل طلبك ✓</h2><p>رقم الطلب <b>${id}</b>. ابعت الطلب لصاحب المتجر ليأكده.</p><textarea readonly rows="7"></textarea>`+(WA?`<a class="bt w" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}" target="_blank">إرسال عبر واتساب</a>`:`<button class="bt w" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.previousElementSibling.value)">نسخ الطلب</button>`));
$('#sh textarea').value=msg}
grid();
</script></body></html>
