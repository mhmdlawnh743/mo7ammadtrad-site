<main class="sec"><h2>كتبي</h2><div class="gr" id="g"></div><noscript><ul><li>صُدفتي - 5 د.أ - مجموعة نصوص أدبية وخواطر بقلم محمد طراد علاونه، إصدار 2025.</li><li>الضربة القاضية - 4 د.أ - رواية عن شوق وحنين وأشياء لا تُقال، وعن تفاصيل صغيرة لا تُنسى.</li><li>ما حدا سألني - 5 د.أ - نصوص وخواطر تتحدث عن الكتمان، وعن تفاصيل تمرّ بصمت دون أن ينتبه إليها أحد.</li></ul></noscript></main></div>

<script>
/* ===== مفاتيح Supabase: ضعها هنا (Project Settings → API) ===== */
const SUPABASE_URL='https://vcvvhtqyalfciycxfptm.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_PsE5BU07lVaXhFVZGW1BhQ_Ze0r2Cbq';
/* ================================================================ */
const WA='962778645175',CLIQ='بنك الاتحاد 0771286150',DEL=2;
const $=s=>document.querySelector(s),f=n=>Number(n).toFixed(3)+' د.أ';
let B=[],C={};try{C=JSON.parse(localStorage.getItem('c')||'{}')}catch(e){}
if(!C||typeof C!=='object')C={};
const sv=()=>{try{localStorage.setItem('c',JSON.stringify(C))}catch(e){}};
const cnt=()=>Object.values(C).reduce((a,b)=>a+b,0),sub=()=>B.reduce((a,b)=>a+(C[b.id]||0)*b.p,0);

/* بناء عناصر آمنة (لا innerHTML لبيانات قاعدة البيانات) */
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function safe(u){try{if(!u)return'';const x=new URL(u,location.href);return(x.protocol==='https:'||x.protocol==='http:')?x.href:''}catch(e){return''}}
function plain(b){const d=el('div','cv');d.appendChild(el('span','',b.t));return d}
function cover(b){
  if(!b.img)return plain(b);
  const i=el('img','ci');i.alt=b.t;i.loading='lazy';i.src=b.img;
  i.onerror=()=>i.replaceWith(plain(b));
  return i}
function status(t,retry){
  const g=$('#g');g.replaceChildren();
  const p=el('p','m st',t);
  if(retry){const r=el('button','bt','إعادة المحاولة');r.style.marginTop='12px';r.onclick=load;p.append(document.createElement('br'),r)}
  g.appendChild(p)}

function grid(){
  const g=$('#g');g.replaceChildren();
  B.forEach(b=>{
    const cd=el('div','cd');cd.onclick=()=>show(b.id);
    const bd=el('div','bd');
    bd.append(el('h3','',b.t),el('p','',b.s),el('span','pr',f(b.p)),el('button','bt w','التفاصيل'));
    cd.append(cover(b),bd);g.appendChild(cd)});
  $('#n').textContent=cnt()}

function openSheet(nodes){
  const x=el('button','x','×');x.setAttribute('aria-label','إغلاق');x.onclick=close_;
  $('#sh').replaceChildren(x,...nodes);$('#ov').classList.add('on')}
function close_(){$('#ov').classList.remove('on')}

function show(id){
  const b=B.find(x=>x.id==id);if(!b)return;
  const n=[cover(b),el('h2','',b.t),el('p','m',b.s)];
  if(b.d){const p=el('p','',b.d);p.style.whiteSpace='pre-line';n.push(p)}
  const meta=[b.ed,b.pg?b.pg+' صفحة':''].filter(Boolean).join(' · ');
  if(meta)n.push(el('p','m',meta));
  n.push(el('span','pr',f(b.p)));
  const a=el('button','bt w','أضف إلى السلة');a.onclick=()=>add(b.id);n.push(a);
  if(b.url){
    const l=el('a','bt w','اطلب عبر الرابط');l.href=b.url;l.target='_blank';l.rel='noopener';
    l.style.background='#1c1c1c';l.style.color='#fff';l.style.border='1px solid #333';n.push(l)}
  openSheet(n)}

function add(id){C[id]=Math.min(20,(C[id]||0)+1);sv();grid();cart()}
function chg(id,d){C[id]=Math.min(20,(C[id]||0)+d);if(C[id]<=0)delete C[id];sv();grid();cart()}

function row(a,b,cls){const r=el('div','ln');r.append(el('span',cls||'',a),el('span',cls||'',b));return r}
function cart(){
  const it=B.filter(b=>C[b.id]),n=[el('h2','','سلتي')];
  if(!it.length){n.push(el('p','m','السلة فاضية.'));openSheet(n);return}
  it.forEach(b=>{
    const ln=el('div','ln'),q=el('span','q');
    const m=el('button','','−'),p=el('button','','+');
    m.onclick=()=>chg(b.id,-1);p.onclick=()=>chg(b.id,1);
    q.append(m,document.createTextNode(C[b.id]),p);
    ln.append(el('b','',b.t),q,el('span','m',f(b.p*C[b.id])));
    n.push(ln)});
  n.push(row('المجموع',f(sub())),row('التوصيل',f(DEL)),row('الإجمالي',f(sub()+DEL),'t'));
  const go=el('button','bt w','متابعة الطلب');go.onclick=co;n.push(go);
  openSheet(n)}

function co(){
  const inp=(id,ph,mode)=>{const i=document.createElement('input');i.id=id;i.placeholder=ph;if(mode)i.inputMode=mode;return i};
  const rd=(val,label,chk)=>{const l=el('label','rd'),r=document.createElement('input');r.type='radio';r.name='pm';r.value=val;r.checked=!!chk;l.append(r,document.createTextNode(' '+label));return l};
  const er=el('div','er');er.id='er';
  const go=el('button','bt w','إرسال الطلب عبر واتساب');go.onclick=ok;
  openSheet([el('h2','','بيانات التوصيل'),
    inp('a1','الاسم الكامل'),inp('a2','رقم الهاتف','tel'),inp('a3','المحافظة / المنطقة'),inp('a4','العنوان بالتفصيل'),
    rd('الدفع عند الاستلام','الدفع عند الاستلام',true),rd('CliQ','تحويل CliQ — '+CLIQ),
    el('p','m','الإجمالي مع التوصيل: '+f(sub()+DEL)),er,go])}

function ok(){
  const v=i=>$('#a'+i).value.trim(),pm=document.querySelector('input[name=pm]:checked').value;
  if(!v(1)||v(2).replace(/\D/g,'').length<9||!v(3)||!v(4)){$('#er').textContent='عبّي كل الخانات، ورقم الهاتف لازم يكون صحيح.';return}
  const id='M'+Date.now().toString().slice(-6),L=B.filter(b=>C[b.id]).map(b=>`${b.t} × ${C[b.id]}`).join('\n');
  const msg=`طلب جديد ${id}\n${L}\nالإجمالي: ${f(sub()+DEL)}\nالدفع: ${pm}\n${v(1)} | ${v(2)}\n${v(3)} - ${v(4)}`;
  const url='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
  C={};sv();grid();close_();
  if(!window.open(url,'_blank'))location.href=url}

/* بيانات SEO للكتب (تتحدث تلقائياً مع تغيّر الكتب) */
function ld(){
  const s=document.getElementById('ld-books')||document.createElement('script');
  s.id='ld-books';s.type='application/ld+json';
  s.textContent=JSON.stringify(B.map(b=>({"@context":"https://schema.org","@type":"Book","name":b.t,
    "author":{"@type":"Person","name":"محمد طراد علاونه","alternateName":"Mohammad trad Alawneh"},
    "description":b.d||b.s,"inLanguage":"ar","bookFormat":"https://schema.org/Paperback",
    "offers":{"@type":"Offer","price":String(b.p),"priceCurrency":"JOD","availability":"https://schema.org/InStock","url":"https://mo7ammadtrad.site/"}})));
  document.head.appendChild(s)}

async function load(){
  status('جارٍ التحميل…');
  try{
    if(!window.supabase||SUPABASE_URL.indexOf('PUT_')===0)throw new Error('config');
    const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    const {data,error}=await sb.from('books')
      .select('id,title,short_desc,details,price,pages,edition,cover_url,order_url,sort_order,created_at')
      .eq('is_visible',true)
      .order('sort_order',{ascending:true}).order('created_at',{ascending:true});
    if(error)throw error;
    B=(data||[]).map(r=>({id:r.id,t:r.title,s:r.short_desc||'',d:r.details||'',p:Number(r.price)||0,
      pg:r.pages||0,ed:r.edition||'',img:safe(r.cover_url),url:safe(r.order_url)}));
    Object.keys(C).forEach(k=>{if(!B.some(b=>b.id==k))delete C[k]});sv();
    if(B.length)grid();else status('لا توجد كتب حالياً.');
    $('#n').textContent=cnt();ld();
  }catch(e){status('تعذّر تحميل الكتب.',true)}}

document.addEventListener('keydown',e=>{if(e.key==='Escape')close_()});
$('#n').textContent=cnt();
load();
</script></body></html>
